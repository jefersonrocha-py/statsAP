x-app-image: &app_image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
  image: ${APP_IMAGE}
  pull_policy: never

services:
  mysql-statsap:
    image: ${MYSQL_IMAGE}
    container_name: mysql-statsap
    restart: unless-stopped
    command:
      - --port=${MYSQL_PORT}
      - --character-set-server=${MYSQL_CHARSET}
      - --collation-server=${MYSQL_COLLATION}
      - --mysqlx=OFF
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    expose:
      - "${MYSQL_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h ${MYSQL_HOST} -P ${MYSQL_PORT} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_net

  minio-statsap:
    image: ${MINIO_IMAGE}
    container_name: minio-statsap
    restart: unless-stopped
    command: server /data --address :${MINIO_PORT}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BROWSER: ${MINIO_BROWSER}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS ${MINIO_ENDPOINT}/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app_net

  web-statsap:
    <<: *app_image
    container_name: web-statsap
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    depends_on:
      mysql-statsap:
        condition: service_healthy
    ports:
      - "${HOST_PORT}:${PORT}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch(process.env.APP_BASE_URL + '/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      app_net:
      proxy:
        aliases:
          - ${WEB_PROXY_ALIAS}

  worker-statsap:
    <<: *app_image
    container_name: worker-statsap
    restart: unless-stopped
    init: true
    env_file:
      - ./.env
    depends_on:
      web-statsap:
        condition: service_healthy
    entrypoint: ["node", "scripts/gdms-cron.mjs"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app_net

volumes:
  mysql_data:
  minio_data:

networks:
  app_net:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
